[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jina-reader-mcp-local"
version = "0.1.0"
description = "A Windows-native stdio MCP server for web search and page reading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "ddgs>=9,<11",
  "httpx>=0.28.1,<0.29",
  "mcp>=1.28.0,<2",
  "playwright>=1.55,<2",
  "pydantic>=2.0,<3",
  "trafilatura>=2,<3",
]

[project.scripts]
jina-reader-mcp = "jina_reader_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jina_reader_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
